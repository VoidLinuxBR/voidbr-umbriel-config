# ==============================================================================
# Configuração Padrão do Umbriel (Void Linux LiveCD Edition)
#
# A maioria das alterações entra em vigor automaticamente assim que o arquivo é salvo.
# Para testar a sintaxe a qualquer momento, execute: `umbriel config validate`
#
# Documentação completa oficial: https://docs.noctalia.dev/umbriel/
# ==============================================================================

# ==============================================================================
# Inclusões (Includes)
# ==============================================================================
[include]
files = []

# ==============================================================================
# Geral (General)
# Serviços iniciados automaticamente na abertura da sessão Wayland.
# ==============================================================================
[general]
show_cheatsheet = false

autostart = [
    "xdg-user-dirs-update",                           # Criação e registro das pastas de usuário (Downloads, Documentos, etc.)
    "noctalia",                                       # Desktop shell (barra, notificações, painéis, wallpaper)
    "pipewire",                                       # Servidor de áudio e multimídia
    "/usr/local/bin/umbriel-autoscale",               # Ajuste automático de escala para telas 2K/4K
    "/usr/local/bin/voidbr-umbriel-shortcuts",        # Guia de atalhos e boas-vindas VoidBR
    "xhost +si:localuser:root"                        # Permissão para root desenhar na sessão gráfica via Xwayland
]

# ==============================================================================
# Variáveis de Ambiente (Environment)
# Repassadas para todos os aplicativos iniciados pelo Umbriel.
# ==============================================================================
[environment]
QT_QPA_PLATFORM = "wayland;xcb"
QT_QPA_PLATFORMTHEME = "qt6ct"



# ==============================================================================
# Saídas de Vídeo (Monitores)
# Por padrão, o Umbriel detecta automaticamente a resolução máxima e taxa de
# atualização de qualquer monitor conectado (HDMI, DisplayPort, eDP).
# Para fixar opções personalizadas, execute `umbriel outputs` e adicione um bloco:
#
# [output.DP-1]
# mode = "2560x1440@144"
# scale = 1.25
# ==============================================================================

# ==============================================================================
# Aparência (Appearance)
# ==============================================================================
[appearance.blur]
radius = 3

[appearance.tab_bar]
hide_when_single = true

# ==============================================================================
# Dispositivos de Entrada (Teclado e Mouse)
# Configuração híbrida: suporta ABNT2 (br) e US-Internacional.
# Pressione Alt + Shift para alternar rapidamente entre os dois layouts.
# ==============================================================================
[input.keyboard]
numlock_toggle = true
layout = "br"
variant = ""
options = "grp:alt_shift_toggle"

[input.cursor]
theme = "Bibata-Modern-Ice"
size = 24

# ==============================================================================
# Atalhos de Teclado (Keybinds)
# ==============================================================================
[keybinds]

# --- Captura de Tela (PrintScreen) ---
"Print" = { action = "spawn:captura_de_tela", repeat = false }
"Shift+Print" = { action = "spawn:captura_de_tela_inteira", repeat = false }

# --- Teclas Multimídia e Brilho (Fn) ---
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", repeat = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", repeat = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", repeat = false }
"XF86AudioMicMute" = { action = "spawn:noctalia msg mic-mute", repeat = false }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", repeat = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", repeat = true }

# --- Aplicativos, Sessão e Ajuda ---
"Mod+Return" = { action = "spawn:foot", repeat = false }                      # Abrir terminal foot
"Mod" = "spawn:noctalia msg panel-toggle launcher"                           # Super: menu de aplicativos
"Mod+slash" = { action = "spawn:/usr/local/bin/voidbr-umbriel-shortcuts", repeat = false }        # Super + /: guia de atalhos
"Mod+Shift+Slash" = { action = "spawn:/usr/local/bin/voidbr-umbriel-shortcuts", repeat = false }     # Super + ? (Shift + /): guia de atalhos
"Mod+Q" = { action = "window-close", repeat = false }                         # Fechar janela ativa
"Mod+Escape" = "session-quit"                                                 # Sair da sessão
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# --- Foco e Navegação de Janelas ---
"Mod+Left" = "window-focus-left"                                             # Foco à esquerda
"Mod+Down" = "window-focus-down"                                             # Foco abaixo
"Mod+Up" = "window-focus-up"                                                 # Foco acima
"Mod+Right" = "window-focus-right"                                           # Foco à direita
"Mod+H" = "window-focus-left"                                                 # Estilo Vim: esquerda
"Mod+J" = "window-focus-down"                                                 # Estilo Vim: baixo
"Mod+K" = "window-focus-up"                                                   # Estilo Vim: cima
"Mod+L" = "window-focus-right"                                                # Estilo Vim: direita
"Mod+F1" = "window-focus-next"                                                # Próxima janela

# --- Mover Janelas e Colunas ---
"Mod+Shift+Left" = "column-move-left"                                        # Mover coluna à esquerda
"Mod+Shift+Down" = "window-move-down"                                         # Mover janela abaixo
"Mod+Shift+Up" = "window-move-up"                                             # Mover janela acima
"Mod+Shift+Right" = "column-move-right"                                      # Mover coluna à direita

# --- Estado das Janelas e Layout ---
"Mod+T" = { action = "window-toggle-floating", repeat = false }              # Janela flutuante
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }   # Foco flutuante/normal
"Mod+P" = { action = "window-toggle-pinned", repeat = false }                 # Fixar janela
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }      # Maximizar até as bordas
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }             # Tela cheia
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }          # Maximizar janela
"Mod+R" = "window-cycle-primary-extent"                                       # Ajustar largura pré-definida
"Mod+Shift+R" = "window-cycle-primary-extent-back"                            # Ajustar largura (sentido inverso)
"Mod+Comma" = { action = "window-consume-left", repeat = false }                                           # Agrupar à esquerda
"Mod+Period" = { action = "window-consume-right", repeat = false }                                         # Agrupar à direita
"Mod+Shift+Comma" = { action = "window-consume-or-expel-left", repeat = false }                           # Desagrupar / expulsar à esquerda
"Mod+Shift+Period" = { action = "window-consume-or-expel-right", repeat = false }                         # Desagrupar / expulsar à direita
"Mod+Ctrl+Comma" = { action = "window-consume-from-left", repeat = false }                              # Puxar a janela da esquerda para esta coluna
"Mod+Ctrl+Period" = { action = "window-consume-from-right", repeat = false }                            # Puxar a janela da direita para esta coluna
# "Mod+Alt+T" = "layout-toggle-split"                                                                  # Alternar divisão horizontal/vertical (exige layout.mode = "dwindle")
# Efeitos de borda (opcional): exigem um [effects.pool.borders] no [effects]; descomente junto com ele
# "Mod+Shift+E" = "effect-border-cycle:borders"                                                        # Trocar para o próximo efeito de borda do grupo
# "Mod+Ctrl+E" = "effect-border-toggle"                                                                # Ligar/desligar o efeito de borda
# "Mod+Alt+E" = "effect-border-reset"                                                                  # Restaurar o efeito de borda original
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }                # Alternar abas/pilha (Tabbed)
"Mod+bracketleft" = "column-focus-tab-previous"                              # Focar aba anterior
"Mod+bracketright" = "column-focus-tab-next"                                 # Focar próxima aba
"Mod+WheelUp" = "window-focus-left"                                           # Scroll para a esquerda
"Mod+WheelDown" = "window-focus-right"                                        # Scroll para a direita
"Mod+O" = { action = "overview-toggle", repeat = false }                      # Visão Geral (Overview)

# --- Espaços de Trabalho (Workspaces) ---
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"

# Mover janela ativa para outro espaço de trabalho
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# --- Scratchpad ---
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }  # Enviar ao scratchpad
"Mod+Space" = "scratchpad-toggle"                                             # Abrir/fechar scratchpad
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false } # Restaurar do scratchpad
"Mod+Tab" = "scratchpad-focus-next"                                           # Próximo no scratchpad

# ==============================================================================
# Layout
# ==============================================================================
[layout]
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

[layout.tabs]
default_display = "tabbed"
middle_click_closes = true
scroll_switches_tabs = true

# ==============================================================================

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Calculadora inicia sempre flutuante e compacta
[[window_rule]]
match.app_id = "^(io.elementary.calculator|galculator|mate-calc)$"
default_floating = true
default_floating_size_px = { width = 360, height = 520 }

# Configurador de monitores inicia flutuante
[[window_rule]]
match.app_id = "^wdisplays$"
default_floating = true
default_floating_size_px = { width = 800, height = 500 }

# Editor de partições GParted inicia flutuante
[[window_rule]]
match.app_id = "^(gpartedbin|GParted)$"
default_floating = true
default_floating_size_px = { width = 920, height = 650 }

# Visualizador de imagens Loupe/Ristretto inicia flutuante
[[window_rule]]
match.app_id = "^(org.gnome.Loupe|loupe|ristretto|org.xfce.ristretto)$"
default_floating = true
default_floating_size_px = { width = 950, height = 700 }

# Leitor de PDF Zathura inicia flutuante
[[window_rule]]
match.app_id = "^(org.pwmt.zathura|zathura)$"
default_floating = true
default_floating_size_px = { width = 900, height = 800 }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ==============================================================================
# Regras de Camada (Layer Rules)
# ==============================================================================
# A barra e os widgets ficam sobre o papel de parede e usam o blur otimizado em cache
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

# Painéis, dock, notificações e OSD abrem sobre janelas; desfocam o conteúdo ao vivo atrás deles
[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

# ==============================================================================
# Cantos Ativos (Hot Corners)
# ==============================================================================
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

[include.optional]
files = [
    "noctalia.toml",
    "/usr/share/umbriel/effects/cursor/trail/effect.toml",
    "/usr/share/umbriel/effects/border/pulse/effect.toml"
]

# ==============================================================================
# Efeitos Visuais (UmbrielFX)
# ==============================================================================
[effects]
cursor = "trail"
border = "pulse"
